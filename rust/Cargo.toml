[package]
name = "rust_lib_opencode_remote"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
regex = "1.10.6"
rsa = "0.9.10"
russh = "0.64.1"
russh-keys = "0.49.2"
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "p256", "alloc", "std", "getrandom", "encryption"] }
tokio = { version = "1.54.1", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
